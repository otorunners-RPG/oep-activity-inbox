<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06170f">
  <title>OTO Runners - RPG — Leaderboard</title>
  <link rel="stylesheet" href="./participant-site.css">
</head>
<body>
  <header class="site-topbar">
    <div class="site-shell site-topbar-inner">
      <a class="brand-mark" href="./task.html" aria-label="OTO Runners - RPG Task">
        <img src="./assets/oto-runners-logo.png" alt="OTO Runners">
      </a>
      <nav class="site-nav" aria-label="Participant navigation">
        <a href="./task.html">Task</a>
        <a class="active" href="./leaderboard.html" aria-current="page">Leaderboard</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="site-shell">
      <section class="hero">
        <h1>LEADERBOARD</h1>
        <p class="game-title">RUN PLAYING GAMES</p>
        <p class="subtitle">Current competition standings from the latest published OTO Runners - RPG snapshot.</p>
      </section>

      <section class="card toolbar">
        <div class="meta">
          <strong id="seasonName">Loading season...</strong>
          <span id="publishedAt">Waiting for published data</span>
        </div>
        <button id="refreshButton" class="btn" type="button">REFRESH</button>
      </section>

      <nav class="card leader-tabs" aria-label="Leaderboard view">
        <button id="guildTab" class="active" type="button">GUILD</button>
        <button id="athleteTab" type="button">ATHLETE</button>
      </nav>

      <div id="statusBox" class="status">Loading leaderboard...</div>

      <section id="leaderboardContent" hidden>
        <div id="podium" class="podium"></div>
        <div class="card table-card">
          <div class="table-scroll">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
            <div id="emptyState" class="empty-card" hidden>No published leaderboard data yet.</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>OTO Runners - RPG • Run Playing Games</footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxHBw2BlpR6UdZrUAggLWmUN2SIaw8vIUNK9Rf_ckCm8vXOm0ksYlXgbOep5TLmMamqmA/exec?action=publicLeaderboardSnapshot";
  const state = { mode: "guild", guildLeaderboard: [], athleteLeaderboard: [], meta: {} };
  const el = (id) => document.getElementById(id);
  const number = (value) => { const n = Number(value); return Number.isFinite(n) ? n : 0; };
  const formatNumber = (value, decimals = 0) => number(value).toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });

  function formatPublishedAt(value) {
    if (!value) return "No publish timestamp";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value);
    return "Published " + date.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  }

  function setStatus(text, type = "") { el("statusBox").textContent = text; el("statusBox").className = "status" + (type ? " " + type : ""); }
  function getRows() { return state.mode === "guild" ? state.guildLeaderboard : state.athleteLeaderboard; }
  function getName(row) { return state.mode === "guild" ? (row.guildName || row.guildCode || "-") : (row.athleteName || row.athleteCode || "-"); }
  function getSub(row) { return state.mode === "guild" ? (row.guildCode || "") : [row.guildName, row.divisionName].filter(Boolean).join(" · "); }

  function renderPodium(rows) {
    const podium = el("podium"); podium.innerHTML = "";
    rows.slice(0,3).forEach((row,index) => {
      const card = document.createElement("article"); card.className = "card podium-card";
      card.innerHTML = '<div class="podium-rank">#' + String(row.rank || index + 1) + '</div><div class="podium-name"></div><div class="podium-sub"></div><div class="podium-points">' + formatNumber(row.totalPoints) + ' pts</div>';
      card.querySelector(".podium-name").textContent = getName(row);
      card.querySelector(".podium-sub").textContent = getSub(row);
      podium.appendChild(card);
    });
  }

  function renderGuildTable(rows) {
    el("tableHead").innerHTML = "<tr><th>Rank</th><th>Guild</th><th>Athletes</th><th>Points</th><th>Distance</th><th>Activities</th></tr>";
    el("tableBody").innerHTML = rows.map(row => '<tr><td class="rank">#' + formatNumber(row.rank) + '</td><td>' + escapeHtml(row.guildName || row.guildCode || "-") + '</td><td>' + formatNumber(row.athleteCount) + '</td><td class="points">' + formatNumber(row.totalPoints) + '</td><td>' + formatNumber(row.totalDistanceKm,2) + ' km</td><td>' + formatNumber(row.totalActivityCount) + '</td></tr>').join("");
  }

  function renderAthleteTable(rows) {
    el("tableHead").innerHTML = "<tr><th>Rank</th><th>Athlete</th><th>Guild</th><th>Points</th><th>Distance</th><th>Activities</th></tr>";
    el("tableBody").innerHTML = rows.map(row => '<tr><td class="rank">#' + formatNumber(row.rank) + '</td><td>' + escapeHtml(row.athleteName || row.athleteCode || "-") + '</td><td>' + escapeHtml(row.guildName || "-") + '</td><td class="points">' + formatNumber(row.totalPoints) + '</td><td>' + formatNumber(row.totalDistanceKm,2) + ' km</td><td>' + formatNumber(row.totalActivityCount) + '</td></tr>').join("");
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
  }

  function render() {
    const rows = getRows();
    el("guildTab").classList.toggle("active", state.mode === "guild");
    el("athleteTab").classList.toggle("active", state.mode === "athlete");
    el("emptyState").hidden = rows.length > 0;
    renderPodium(rows);
    if (state.mode === "guild") renderGuildTable(rows); else renderAthleteTable(rows);
    el("leaderboardContent").hidden = false;
  }

  async function loadLeaderboard() {
    const button = el("refreshButton"); button.disabled = true; button.textContent = "LOADING..."; setStatus("Loading latest published leaderboard...");
    try {
      const response = await fetch(API_URL + "&_=" + Date.now(), { cache: "no-store" });
      const payload = await response.json();
      if (!response.ok || payload.success !== true) throw new Error(payload?.error?.message || "Unable to load leaderboard.");
      state.guildLeaderboard = Array.isArray(payload.guildLeaderboard) ? payload.guildLeaderboard : [];
      state.athleteLeaderboard = Array.isArray(payload.athleteLeaderboard) ? payload.athleteLeaderboard : [];
      state.meta = payload.meta || {};
      el("seasonName").textContent = state.meta.seasonName || state.meta.seasonId || "OTO Runners - RPG";
      el("publishedAt").textContent = formatPublishedAt(state.meta.publishedAt);
      setStatus("Leaderboard loaded.", "ok"); render();
    } catch (error) {
      setStatus(error.message || "Unable to load leaderboard.", "error");
      el("leaderboardContent").hidden = true;
    } finally { button.disabled = false; button.textContent = "REFRESH"; }
  }

  el("guildTab").addEventListener("click", () => { state.mode = "guild"; render(); });
  el("athleteTab").addEventListener("click", () => { state.mode = "athlete"; render(); });
  el("refreshButton").addEventListener("click", loadLeaderboard);
  loadLeaderboard();
</script>
</body>
</html>
