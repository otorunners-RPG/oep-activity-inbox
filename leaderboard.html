<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a12">

  <title>OEP Leaderboard</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #06170f;
      --panel: #0e291d;
      --panel-2: #123324;
      --line: #876a37;
      --text: #f5ecd8;
      --muted: #b9b19e;
      --accent: #efad2f;
      --ok: #9ccd75;
      --soft: rgba(255,255,255,.07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(circle at top right, rgba(239,173,47,.08), transparent 28rem),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--ok);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(2rem, 7vw, 3.6rem);
      line-height: .98;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .meta strong {
      display: block;
      color: var(--text);
    }

    .meta span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .86rem;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      background: var(--accent);
      color: #1d1509;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }

    .tab {
      background: transparent;
      color: var(--muted);
    }

    .tab.active {
      background: var(--accent);
      color: #1d1509;
    }

    .status {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      color: var(--muted);
    }

    .status.ok {
      color: var(--ok);
    }

    .status.error {
      color: #ffb0a5;
    }

    .podium {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .podium-card {
      min-height: 126px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .podium-rank {
      color: var(--accent);
      font-weight: 900;
    }

    .podium-name {
      margin-top: 12px;
      font-size: 1.05rem;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .podium-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: .88rem;
    }

    .podium-points {
      margin-top: 12px;
      color: var(--ok);
      font-size: 1.15rem;
      font-weight: 900;
    }

    .table-card {
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--soft);
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    td {
      font-size: .92rem;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .rank {
      color: var(--accent);
      font-weight: 900;
    }

    .points {
      color: var(--ok);
      font-weight: 900;
    }

    .empty {
      padding: 34px 18px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 720px) {
      .podium {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }

      .toolbar button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
<main>

  <header>
    <p class="eyebrow">OTO EVENT PLATFORM</p>
    <h1>LEADERBOARD</h1>
    <p class="subtitle">
      Current competition standings from the latest published OEP snapshot.
    </p>
  </header>

  <section class="toolbar">
    <div class="meta">
      <strong id="seasonName">Loading season...</strong>
      <span id="publishedAt">Waiting for published data</span>
    </div>

    <button id="refreshButton" type="button">
      REFRESH
    </button>
  </section>

  <nav class="tabs" aria-label="Leaderboard view">
    <button
      id="guildTab"
      class="tab active"
      type="button"
    >
      GUILD
    </button>

    <button
      id="athleteTab"
      class="tab"
      type="button"
    >
      ATHLETE
    </button>
  </nav>

  <div
    id="statusBox"
    class="status"
  >
    Loading leaderboard...
  </div>

  <section id="leaderboardContent" hidden>
    <div id="podium" class="podium"></div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>

        <div
          id="emptyState"
          class="empty"
          hidden
        >
          No published leaderboard data yet.
        </div>
      </div>
    </div>
  </section>

  <footer>
    Checkpoint 11.7 — Static Participant Frontend
  </footer>

</main>

<script>
  const API_URL =
    "https://script.google.com/macros/s/AKfycbxHBw2BlpR6UdZrUAggLWmUN2SIaw8vIUNK9Rf_ckCm8vXOm0ksYlXgbOep5TLmMamqmA/exec?action=publicLeaderboardSnapshot";

  const state = {
    mode: "guild",
    guildLeaderboard: [],
    athleteLeaderboard: [],
    meta: {}
  };


  function el(id) {
    return document.getElementById(id);
  }


  function number(value) {
    const parsed =
      Number(value);

    return Number.isFinite(parsed)
      ? parsed
      : 0;
  }


  function formatNumber(
    value,
    decimals = 0
  ) {

    return number(value)
      .toLocaleString(
        "en-US",
        {
          minimumFractionDigits:
            decimals,
          maximumFractionDigits:
            decimals
        }
      );
  }


  function formatPublishedAt(value) {

    if (!value) {
      return "No publish timestamp";
    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return String(value);
    }


    return (
      "Published " +
      date.toLocaleString(
        undefined,
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      )
    );
  }


  function setStatus(
    text,
    type = ""
  ) {

    const box =
      el("statusBox");


    box.textContent =
      text;


    box.className =
      "status" +
      (
        type
          ? " " + type
          : ""
      );
  }


  function getRows() {

    return state.mode === "guild"
      ? state.guildLeaderboard
      : state.athleteLeaderboard;
  }


  function getName(row) {

    return state.mode === "guild"
      ? (
          row.guildName ||
          row.guildCode ||
          "-"
        )
      : (
          row.athleteName ||
          row.athleteCode ||
          "-"
        );
  }


  function getSub(row) {

    return state.mode === "guild"
      ? (
          row.guildCode ||
          ""
        )
      : (
          [
            row.guildName,
            row.divisionName
          ]
            .filter(Boolean)
            .join(" · ")
        );
  }


  function renderPodium(rows) {

    const podium =
      el("podium");


    podium.innerHTML = "";


    rows
      .slice(0, 3)
      .forEach(
        function(row, index) {

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "podium-card";


          card.innerHTML =
            '<div class="podium-rank">#' +
            String(
              row.rank ||
              index + 1
            ) +
            '</div>' +
            '<div class="podium-name"></div>' +
            '<div class="podium-sub"></div>' +
            '<div class="podium-points">' +
            formatNumber(
              row.totalPoints
            ) +
            ' pts</div>';


          card.querySelector(
            ".podium-name"
          ).textContent =
            getName(row);


          card.querySelector(
            ".podium-sub"
          ).textContent =
            getSub(row);


          podium.appendChild(
            card
          );
        }
      );
  }


  function renderGuildTable(rows) {

    el("tableHead").innerHTML =
      "<tr>" +
        "<th>Rank</th>" +
        "<th>Guild</th>" +
        "<th>Athletes</th>" +
        "<th>Points</th>" +
        "<th>Distance</th>" +
        "<th>Activities</th>" +
      "</tr>";


    el("tableBody").innerHTML =
      rows
        .map(
          function(row) {
            return (
              "<tr>" +
                '<td class="rank">#' +
                  String(row.rank || "-") +
                "</td>" +
                "<td>" +
                  escapeHtml(
                    row.guildName ||
                    row.guildCode ||
                    "-"
                  ) +
                "</td>" +
                "<td>" +
                  formatNumber(
                    row.athleteCount
                  ) +
                "</td>" +
                '<td class="points">' +
                  formatNumber(
                    row.totalPoints
                  ) +
                "</td>" +
                "<td>" +
                  formatNumber(
                    row.totalDistanceKm,
                    2
                  ) +
                  " km</td>" +
                "<td>" +
                  formatNumber(
                    row.totalActivityCount
                  ) +
                "</td>" +
              "</tr>"
            );
          }
        )
        .join("");
  }


  function renderAthleteTable(rows) {

    el("tableHead").innerHTML =
      "<tr>" +
        "<th>Rank</th>" +
        "<th>Athlete</th>" +
        "<th>Guild</th>" +
        "<th>Points</th>" +
        "<th>Distance</th>" +
        "<th>Activities</th>" +
      "</tr>";


    el("tableBody").innerHTML =
      rows
        .map(
          function(row) {
            return (
              "<tr>" +
                '<td class="rank">#' +
                  String(row.rank || "-") +
                "</td>" +
                "<td>" +
                  escapeHtml(
                    row.athleteName ||
                    row.athleteCode ||
                    "-"
                  ) +
                "</td>" +
                "<td>" +
                  escapeHtml(
                    row.guildName ||
                    row.guildCode ||
                    "-"
                  ) +
                "</td>" +
                '<td class="points">' +
                  formatNumber(
                    row.totalPoints
                  ) +
                "</td>" +
                "<td>" +
                  formatNumber(
                    row.totalDistanceKm,
                    2
                  ) +
                  " km</td>" +
                "<td>" +
                  formatNumber(
                    row.totalActivityCount
                  ) +
                "</td>" +
              "</tr>"
            );
          }
        )
        .join("");
  }


  function escapeHtml(value) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      String(
        value || ""
      );


    return div.innerHTML;
  }


  function render() {

    const rows =
      getRows();


    el("guildTab")
      .classList.toggle(
        "active",
        state.mode === "guild"
      );


    el("athleteTab")
      .classList.toggle(
        "active",
        state.mode === "athlete"
      );


    renderPodium(
      rows
    );


    if (
      state.mode === "guild"
    ) {
      renderGuildTable(
        rows
      );

    } else {
      renderAthleteTable(
        rows
      );
    }


    el("emptyState").hidden =
      rows.length !== 0;


    el("leaderboardContent").hidden =
      false;
  }


  async function loadLeaderboard() {

    const button =
      el("refreshButton");


    button.disabled = true;
    button.textContent =
      "LOADING...";


    setStatus(
      "Loading latest published leaderboard..."
    );


    try {

      const response =
        await fetch(
          API_URL +
          "&_=" +
          Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {
        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const payload =
        await response.json();


      if (
        !payload ||
        payload.success !== true
      ) {
        throw new Error(
          payload &&
          payload.error
            ? payload.error
            : "Invalid leaderboard response."
        );
      }


      state.guildLeaderboard =
        Array.isArray(
          payload.guildLeaderboard
        )
          ? payload.guildLeaderboard
          : [];


      state.athleteLeaderboard =
        Array.isArray(
          payload.athleteLeaderboard
        )
          ? payload.athleteLeaderboard
          : [];


      state.meta =
        payload.meta || {};


      el("seasonName").textContent =
        state.meta.seasonName ||
        state.meta.seasonId ||
        "OEP Competition";


      el("publishedAt").textContent =
        formatPublishedAt(
          state.meta.publishedAt
        );


      setStatus(
        "Leaderboard loaded.",
        "ok"
      );


      render();

    } catch (error) {

      console.error(error);


      setStatus(
        "Unable to load leaderboard: " +
        (
          error.message ||
          "Unknown error"
        ),
        "error"
      );

    } finally {

      button.disabled = false;
      button.textContent =
        "REFRESH";
    }
  }


  el("guildTab")
    .addEventListener(
      "click",
      function() {
        state.mode = "guild";
        render();
      }
    );


  el("athleteTab")
    .addEventListener(
      "click",
      function() {
        state.mode = "athlete";
        render();
      }
    );


  el("refreshButton")
    .addEventListener(
      "click",
      loadLeaderboard
    );


  loadLeaderboard();
</script>

</body>
</html>
