<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a12">

  <title>OEP Smart Activity Extractor</title>

  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    :root {
      color-scheme: dark;
      --bg: #071a12;
      --panel: #10291e;
      --line: #9a7840;
      --text: #f3ead3;
      --muted: #bcb49f;
      --accent: #e4aa33;
      --ok: #98ca74;
      --warn: #efb34b;
      --error: #ff8a80;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 4px;
    }

    .subtitle {
      margin-top: 0;
      color: var(--muted);
    }

    .card {
      margin-top: 20px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .field {
      margin: 14px 0;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 4px;
    }

    .value {
      display: block;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 700;
    }

    img {
      display: block;
      width: 100%;
      max-height: 620px;
      object-fit: contain;
      margin-top: 16px;
      border-radius: 12px;
      background: #000;
    }

    button, a.button {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .primary {
      background: var(--accent);
      color: #18120a;
    }

    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .ok {
      color: var(--ok);
      font-weight: 800;
    }

    .warning {
      color: var(--warn);
    }

    .error {
      color: var(--error);
    }

    .smart-status {
      margin-top: 12px;
      color: var(--muted);
      min-height: 1.4em;
    }

    .smart-status.ok {
      color: var(--ok);
    }

    .smart-status.error {
      color: var(--error);
    }

    .progress-wrap {
      width: 100%;
      height: 16px;
      margin-top: 10px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width .2s ease;
    }

    .progress-label {
      margin-top: 5px;
      text-align: right;
      color: var(--muted);
      font-size: .8rem;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .metric {
      padding: 14px 10px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      text-align: center;
    }

    .metric .name {
      color: var(--muted);
      font-size: .78rem;
      margin-bottom: 6px;
    }

    .metric .number {
      font-size: 1.15rem;
      font-weight: 900;
    }

    .validation {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .validation.MATCHED {
      border-color: var(--ok);
    }

    .validation.CHECK,
    .validation.NEEDS_REVIEW,
    .validation.SKIPPED_SHORT_ACTIVITY {
      border-color: var(--warn);
    }

    .validation.MISMATCH {
      border-color: var(--error);
    }

    textarea {
      width: 100%;
      min-height: 180px;
      margin-top: 10px;
      padding: 14px;
      background: #071a12;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      resize: vertical;
      font: inherit;
      line-height: 1.5;
    }

    details {
      margin-top: 16px;
    }

    summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 800;
    }

    canvas {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 12px;
      background: #fff;
    }

    @media (max-width: 520px) {
      .metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<main>

  <h1>SMART ACTIVITY EXTRACTOR</h1>
  <p class="subtitle">
    Checkpoint 11.2B.2 — bottom-strip adaptive OCR + parser + consistency check.
  </p>

  <section id="statusCard" class="card">
    Loading latest shared payload...
  </section>

  <section id="payloadCard" class="card" hidden>

    <div class="field">
      <span class="label">Shared Text</span>
      <span id="sourceText" class="value"></span>
    </div>

    <div class="field">
      <span class="label">Activity Image</span>
      <span id="fileMeta" class="value"></span>
    </div>

    <img id="preview" alt="Shared activity preview" hidden>

  </section>

  <section id="extractCard" class="card" hidden>

    <button id="extractButton" class="primary">
      SMART EXTRACT ACTIVITY
    </button>

    <div id="smartStatus" class="smart-status">
      READY
    </div>

    <div class="progress-wrap">
      <div id="smartProgressBar" class="progress-bar"></div>
    </div>

    <div id="smartProgressLabel" class="progress-label">
      0%
    </div>

    <div id="resultPanel" hidden>

      <div class="field">
        <span class="label">Detected Layout</span>
        <span id="layout" class="value"></span>
      </div>

      <div class="field">
        <span class="label">Sport</span>
        <span id="sportType" class="value"></span>
      </div>

      <div class="metrics">

        <div class="metric">
          <div class="name">DISTANCE</div>
          <div id="distance" class="number">—</div>
        </div>

        <div class="metric">
          <div class="name">DURATION</div>
          <div id="duration" class="number">—</div>
        </div>

        <div class="metric">
          <div class="name">PACE</div>
          <div id="pace" class="number">—</div>
        </div>

      </div>

      <div id="validation" class="validation">
        <strong id="validationStatus"></strong>
        <div id="validationMessage"></div>
        <div id="validationExpected"></div>
      </div>

      <details>
        <summary>SHOW OCR DEBUG</summary>

        <div class="field">
          <span class="label">Adaptive OCR Passes</span>
          <div id="debugPassesHost"></div>
        </div>
      </details>

    </div>

  </section>

  <button id="clearButton" class="secondary">
    CLEAR DEBUG PAYLOAD
  </button>

  <a class="button primary" href="./">
    BACK TO HOME
  </a>

</main>

<script src="./db.js"></script>
<script src="./app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="./smart-extractor.js"></script>

<script>
  let currentImageBlob = null;
  let currentObjectUrl = null;
  let currentSourceText = "";

  function textOrDash(value) {
    return value === undefined || value === null || value === ""
      ? "—"
      : String(value);
  }

  function formatBytes(value) {
    const bytes = Number(value || 0);

    if (!bytes) return "0 B";

    const units = ["B", "KB", "MB", "GB"];
    const index = Math.min(
      Math.floor(Math.log(bytes) / Math.log(1024)),
      units.length - 1
    );

    return (
      (bytes / Math.pow(1024, index)).toFixed(index === 0 ? 0 : 2) +
      " " +
      units[index]
    );
  }

  async function loadPayload() {
    const statusCard = document.querySelector("#statusCard");
    const payloadCard = document.querySelector("#payloadCard");
    const extractCard = document.querySelector("#extractCard");

    try {
      const payload = await getLatestSharedPayload();

      if (!payload) {
        statusCard.innerHTML =
          "<strong>No activity image yet.</strong><br><br>" +
          "Open Strava → Activity → Share → Send to OEP.";

        payloadCard.hidden = true;
        extractCard.hidden = true;
        return;
      }

      statusCard.innerHTML =
        '<span class="ok">PAYLOAD RECEIVED ✅</span>';

      currentSourceText = String(payload.text || "");

      document.querySelector("#sourceText").textContent =
        textOrDash(payload.text);

      document.querySelector("#fileMeta").textContent =
        payload.hasFile
          ? (
              textOrDash(payload.fileName) +
              " • " +
              textOrDash(payload.mimeType) +
              " • " +
              formatBytes(payload.fileSize)
            )
          : "NO FILE";

      payloadCard.hidden = false;

      const preview = document.querySelector("#preview");

      if (
        payload.hasFile &&
        payload.fileBlob &&
        String(payload.mimeType || "").startsWith("image/")
      ) {
        currentImageBlob = payload.fileBlob;

        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
        }

        currentObjectUrl = URL.createObjectURL(payload.fileBlob);

        preview.src = currentObjectUrl;
        preview.hidden = false;
        extractCard.hidden = false;

      } else {
        currentImageBlob = null;
        preview.hidden = true;
        extractCard.hidden = true;
      }

    } catch (error) {
      statusCard.innerHTML =
        '<span class="error">Unable to load payload: ' +
        error.message +
        "</span>";
    }
  }

  document.querySelector("#extractButton").addEventListener(
    "click",
    async () => {
      const button = document.querySelector("#extractButton");
      const resultPanel = document.querySelector("#resultPanel");

      button.disabled = true;
      resultPanel.hidden = true;

      try {
        const result =
          await runSmartExtraction(
            currentImageBlob,
            currentSourceText
          );

        document.querySelector("#layout").textContent =
          result.layout.name +
          " • luminance " +
          result.layout.luminance.toFixed(1);

        document.querySelector("#sportType").textContent =
          result.sportType;

        document.querySelector("#distance").textContent =
          result.distanceKm
            ? result.distanceKm.toFixed(2) + " km"
            : "—";

        document.querySelector("#duration").textContent =
          formatDuration(result.durationSec);

        document.querySelector("#pace").textContent =
          formatPace(result.paceSec);

        const validation = document.querySelector("#validation");

        validation.className =
          "validation " +
          result.validation.status;

        document.querySelector("#validationStatus").textContent =
          result.validation.status;

        document.querySelector("#validationMessage").textContent =
          result.validation.message;

        document.querySelector("#validationExpected").textContent =
          result.validation.expectedPaceSec
            ? (
                "Calculated pace: " +
                formatPace(result.validation.expectedPaceSec)
              )
            : "";

        if (result.selectedRaw) {
          const selected =
            [
              result.selectedRaw.distance
                ? "Distance OCR: " + result.selectedRaw.distance
                : "",
              result.selectedRaw.duration
                ? "Duration OCR: " + result.selectedRaw.duration
                : "",
              result.selectedRaw.pace
                ? "Pace OCR: " + result.selectedRaw.pace
                : ""
            ]
            .filter(Boolean)
            .join(" • ");

          if (selected) {
            document.querySelector("#validationMessage").textContent +=
              " Selected: " + selected;
          }
        }

        const debugHost =
          document.querySelector("#debugPassesHost");

        debugHost.innerHTML = "";

        result.debugPasses.forEach((pass, index) => {
          const wrapper = document.createElement("div");
          wrapper.style.marginTop = "18px";

          const title = document.createElement("div");
          title.className = "label";
          title.textContent =
            (index + 1) + ". " +
            pass.roiName + " / " +
            pass.passName;

          const canvasClone =
            document.createElement("canvas");

          canvasClone.width =
            pass.canvas.width;

          canvasClone.height =
            pass.canvas.height;

          canvasClone
            .getContext("2d")
            .drawImage(pass.canvas, 0, 0);

          const textArea =
            document.createElement("textarea");

          textArea.readOnly = true;
          textArea.value =
            pass.text || "(no text detected)";

          wrapper.appendChild(title);
          wrapper.appendChild(canvasClone);
          wrapper.appendChild(textArea);

          debugHost.appendChild(wrapper);
        });

        resultPanel.hidden = false;

      } catch (error) {
        console.error(error);
        setSmartStatus(
          error.message || "Smart extraction failed.",
          "error"
        );

      } finally {
        button.disabled = false;
      }
    }
  );

  document.querySelector("#clearButton").addEventListener(
    "click",
    async () => {
      await terminateSmartOcr();
      await clearLatestSharedPayload();

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentImageBlob = null;
      currentObjectUrl = null;

      location.reload();
    }
  );

  window.addEventListener("beforeunload", () => {
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
    }
  });

  loadPayload();
</script>
</body>
</html>
